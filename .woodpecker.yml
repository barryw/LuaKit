# Woodpecker CI Configuration for LuaKit
# Runs on local macOS runner with Swift and cog installed

when:
  - event: [push, pull_request]
    branch: [main, develop]

labels:
  platform: darwin/arm64

clone:
  git:
    image: bash
    settings:
      lfs: false

steps:
  - name: build
    image: bash
    commands:
      - echo "=== Building LuaKit ==="
      - swift build --configuration release
      - echo "=== Build Complete ==="

  - name: test
    image: bash
    depends_on: [build]
    commands:
      - echo "=== Running Tests ==="
      - gtimeout 1800 swift test --configuration release --parallel || { echo "Tests timed out or failed"; exit 1; }
      - echo "=== Tests Complete ==="

  - name: lint
    image: bash
    commands:
      - echo "=== Running SwiftLint ==="
      - swiftlint lint --quiet
      - echo "=== Lint Complete ==="

  - name: security
    image: bash
    commands:
      - echo "=== Security Scan ==="
      - swift package show-dependencies --format json > dependencies.json
      - echo "=== Security Scan Complete ==="

  - name: release
    image: bash
    depends_on: [build, test, lint]
    when:
      - event: push
        branch: main
    commands:
      - echo "=== Checking for Version Bump ==="
      - git fetch --tags
      - "LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo 0.0.0) && echo Latest tag is $LATEST_TAG"
      - "cog check --from-latest-tag 2>/dev/null || echo Warning - Some commits may not follow conventional commit format"
      - echo "Determining version bump..."
      - "BUMP_TYPE=$(cog bump --dry-run 2>&1 | grep -oE '(major|minor|patch)' | head -1 || true)"
      - "test -n \"$BUMP_TYPE\" || { echo No version bump needed; exit 0; }"
      - "echo Bump type is $BUMP_TYPE"
      - "cog bump --$BUMP_TYPE"
      - "NEW_TAG=$(git describe --tags --abbrev=0)"
      - "echo New version is $NEW_TAG"
      - "git push origin $NEW_TAG"
      - "RELEASE_NOTES=$(cog changelog --at $NEW_TAG 2>/dev/null || echo Release $NEW_TAG)"
      - "gh release create $NEW_TAG --title \"LuaKit $NEW_TAG\" --notes \"$RELEASE_NOTES\" --latest"
      - echo "=== Release Created ==="

  - name: update-version-assets
    image: bash
    depends_on: [release]
    when:
      - event: push
        branch: main
    commands:
      - "LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null) || exit 0"
      - "VERSION=$(echo $LATEST_TAG | sed 's/+.*//')"
      - "test -n \"$VERSION\" || { echo No version found; exit 0; }"
      - "echo Updating assets to version $VERSION"
      - 'sed -i "" "s/>v[0-9]*\.[0-9]*\.[0-9]*</>v${VERSION}</" Images/luakit-logo.svg'
      - "CACHE_BUST=$(date +%Y%m%d%H%M)"
      - 'sed -i "" "s/luakit-logo\.svg?r=[0-9]*/luakit-logo.svg?r=${CACHE_BUST}/" README.md'
      - 'sed -i "" "s/from: \"[0-9]*\.[0-9]*\.[0-9]*\"/from: \"${VERSION}\"/" README.md'
      - "git diff --quiet Images/luakit-logo.svg README.md || git add Images/luakit-logo.svg README.md"
      - "git diff --cached --quiet || git commit -m \"chore: update logo version to v${VERSION}\""
      - "git diff --cached --quiet || git push origin main"
