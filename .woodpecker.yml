# Woodpecker CI Configuration for LuaKit
# Runs on local macOS runner with Swift and cog installed

when:
  - event: [push, pull_request]
    branch: [main, develop]

steps:
  - name: build
    image: local
    commands:
      - echo "=== Building LuaKit ==="
      - swift build --configuration release
      - echo "=== Build Complete ==="

  - name: test
    image: local
    depends_on: [build]
    commands:
      - echo "=== Running Tests ==="
      - swift test --configuration release --parallel
      - echo "=== Tests Complete ==="

  - name: lint
    image: local
    commands:
      - echo "=== Running SwiftLint ==="
      - swiftlint lint --quiet
      - echo "=== Lint Complete ==="

  - name: security
    image: local
    commands:
      - echo "=== Security Scan ==="
      - swift package show-dependencies --format json > dependencies.json
      - echo "Dependencies exported to dependencies.json"
      - echo "=== Security Scan Complete ==="

  - name: release
    image: local
    depends_on: [build, test, lint]
    when:
      - event: push
        branch: main
    commands:
      - echo "=== Checking for Version Bump ==="
      - git fetch --tags
      - export LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
      - echo "Latest tag is $LATEST_TAG"
      - cog check --from-latest-tag 2>/dev/null || echo "Warning - Some commits may not follow conventional commit format"
      - echo "Determining version bump..."
      - export BUMP_TYPE=$(cog bump --dry-run 2>&1 | grep -oE "(major|minor|patch)" | head -1 || echo "")
      - if [ -z "$BUMP_TYPE" ]; then echo "No version bump needed based on commits"; exit 0; fi
      - echo "Bump type is $BUMP_TYPE"
      - echo "Bumping version..."
      - cog bump --$BUMP_TYPE
      - export NEW_TAG=$(git describe --tags --abbrev=0)
      - echo "New version is $NEW_TAG"
      - git push origin $NEW_TAG
      - export RELEASE_NOTES=$(cog changelog --at $NEW_TAG 2>/dev/null || echo "Release $NEW_TAG")
      - echo "Creating GitHub release..."
      - gh release create "$NEW_TAG" --title "LuaKit $NEW_TAG" --notes "$RELEASE_NOTES" --latest
      - echo "=== Release $NEW_TAG Created ==="

  - name: update-version-assets
    image: local
    depends_on: [release]
    when:
      - event: push
        branch: main
    commands:
      - export LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || exit 0)
      - export VERSION=$(echo "$LATEST_TAG" | sed 's/+.*//')
      - if [ -z "$VERSION" ]; then echo "No version found, skipping asset update"; exit 0; fi
      - echo "Updating assets to version $VERSION"
      - sed -i '' "s/>v[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*</>v${VERSION}</" Images/luakit-logo.svg
      - export CACHE_BUST=$(date +%Y%m%d%H%M)
      - sed -i '' "s/luakit-logo\.svg?r=[0-9]*/luakit-logo.svg?r=${CACHE_BUST}/" README.md
      - sed -i '' "s/from:\ \"[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\"/from:\ \"${VERSION}\"/" README.md
      - git diff --quiet Images/luakit-logo.svg README.md 2>/dev/null || (git add Images/luakit-logo.svg README.md && git commit -m "chore: update logo version to v${VERSION}" && git push origin main && echo "Version assets updated")
